<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Media Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #e0e0e0; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; }

    .phone-wrapper { width: 100vw; height: 100dvh; background: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    @media (min-width: 500px) { .phone-wrapper { width: 380px; height: 780px; border-radius: 40px; border: 8px solid #000000; box-shadow: 0 20px 40px rgba(0,0,0,0.3); } }

    #splash { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; }
    .logo-main { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; }
    .btn-start { background: #fff; color: #000; border: none; padding: 15px 40px; border-radius: 30px; font-weight: 800; cursor: pointer; }

    .main-ui { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; justify-content: space-between; }
    
    .card-canvas-area { width: 100%; height: 210px; display: flex; align-items: center; justify-content: center; }
    
    /* LA CARTA */
    .card { 
      width: 320px; min-height: 160px; background: #fff; border: 3px solid #000; border-radius: 18px; padding: 15px; display: flex; gap: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); align-items: center;
    }

    /* IL BORDO FLESSIBILE: Avvolge l'immagine senza forzarla */
    .card-photo-box { 
      border: 2px solid #000; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      overflow: hidden; 
      background: #f8f8f8;
      min-width: 80px;
      max-width: 120px;
      padding: 4px; /* Spazio tra immagine e bordo */
    }

    .card-photo-box img {
      width: 100%; 
      height: auto; 
      display: block;
    }

    .card-info-box { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-title { font-size: 1.1rem; font-weight: 800; color: #000; }
    .card-voto { font-size: 0.85rem; font-weight: 800; color: #555; }
    .card-review { font-size: 0.75rem; color: #333; font-style: italic; line-height: 1.3; }

    .controls-group { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .input-box { width: 100%; padding: 10px; border: 2px solid #000; border-radius: 12px; outline: none; }
    .btn-download { background: #000; color: #fff; padding: 14px; border-radius: 12px; font-weight: 800; text-align: center; cursor: pointer; }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div id="splash">
      <div class="logo-main">JOURNAL</div>
      <button class="btn-start" onclick="startApp()">INIZIA</button>
    </div>

    <div class="main-ui" id="main-ui">
      <div style="font-weight: 800; text-align: center;">Nuova Scheda</div>

      <div class="card-canvas-area">
        <div class="card" id="main-card">
          <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
            <span id="placeholder" style="font-size:0.7rem;">+</span>
            <img id="card-photo-img" style="display:none;" alt="Foto">
          </div>
          <div class="card-info-box">
            <div class="card-title" id="card-title">Titolo</div>
            <div class="card-voto" id="card-voto">Voto: -</div>
            <div class="card-review" id="card-review">Opinione...</div>
          </div>
        </div>
      </div>
      <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">

      <div class="controls-group">
        <input type="text" class="input-box" placeholder="Titolo" oninput="update('card-title', this.value)">
        <input type="text" class="input-box" placeholder="Voto" oninput="update('card-voto', 'Voto: ' + this.value)">
        <textarea class="input-box" placeholder="Recensione..." oninput="update('card-review', this.value)" style="height: 60px; resize:none;"></textarea>
        <div class="btn-download" onclick="downloadCard()">Scarica Immagine</div>
      </div>
    </div>
  </div>

  <script>
    function startApp() { document.getElementById('splash').style.display = 'none'; document.getElementById('main-ui').style.display = 'flex'; }
    function update(id, val) { document.getElementById(id).innerText = val || (id==='card-title'?'Titolo':id==='card-voto'?'Voto: -':'Opinione...'); }
    
    function loadPhoto(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-photo-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(e.target.files[0]);
    }

    function downloadCard() {
      // Usiamo una scala dinamica e forziamo la larghezza per evitare che html2canvas faccia errori di calcolo
      const card = document.getElementById('main-card');
      html2canvas(card, { 
        scale: 3,
        windowWidth: card.scrollWidth,
        windowHeight: card.scrollHeight
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
