<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; font-family: 'Quicksand', sans-serif; transition: background 0.3s; }
    
    /* GESTIONE TEMA */
    body.light-theme { background-color: #ffffff; color: #000000; }
    body.dark-theme { background-color: #000000; color: #ffffff; }

    .phone-wrapper { width: 100vw; height: 100dvh; position: relative; display: flex; flex-direction: column; }
    @media (min-width: 500px) { .phone-wrapper { width: 380px; height: 780px; margin: auto; border-radius: 40px; border: 8px solid #333; } }

    /* SPLASH SCREEN (ANIMAZIONE ORIGINALE) */
    #splash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; background: #ffffff; }
    .bg-scrolling { display: flex; width: 100%; height: 100%; }
    .col { flex: 1; display: flex; flex-direction: column; }
    .up { animation: scrollUp 20s linear infinite; }
    .down { animation: scrollDown 20s linear infinite; }
    @keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes scrollDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }
    .content-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(255,255,255,0.8); }
    .logo-main { font-size: 4rem; font-weight: 800; color: #000; margin-bottom: 30px; }

    /* UI PRINCIPALE */
    .main-ui { display: none; height: 100%; flex-direction: column; align-items: center; padding: 20px; justify-content: space-evenly; }
    .card { width: 300px; height: 170px; border: 3px solid currentColor; border-radius: 20px; padding: 15px; display: flex; gap: 10px; }
    
    .color-picker { display: flex; gap: 20px; }
    .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid currentColor; cursor: pointer; }
    
    .menu-btn { padding: 10px 20px; border-radius: 15px; border: 1px solid currentColor; cursor: pointer; font-weight: 700; background: transparent; color: inherit; }
  </style>
</head>
<body class="light-theme">

  <div class="phone-wrapper">
    <!-- Splash Screen -->
    <div id="splash">
      <div class="bg-scrolling">
        <div class="col up" id="col1"></div><div class="col down" id="col2"></div><div class="col up" id="col3"></div>
      </div>
      <div class="content-overlay">
        <div class="logo-main">Pocket Card</div>
        <button onclick="startApp()" style="padding:15px 30px; border-radius:20px; font-weight:800;">Entra</button>
      </div>
    </div>

    <!-- UI Principale -->
    <div class="main-ui" id="main-ui">
      <div class="card" id="main-card">
        <div id="photo-area" style="width:100px; height:100px; border: 2px dashed currentColor; display:flex; align-items:center; justify-content:center;">Foto</div>
        <div class="editable" contenteditable="true">Testo qui...</div>
      </div>

      <div class="color-picker">
        <div class="color-dot" style="background:#fff" onclick="setTheme('light')"></div>
        <div class="color-dot" style="background:#000" onclick="setTheme('dark')"></div>
      </div>

      <div class="menu-btn" onclick="openCustomPicker()">Personalizza Avanzato</div>
      <div class="menu-btn" onclick="downloadCard()">Download</div>
    </div>
  </div>

  <script>
    function startApp() { document.getElementById('splash').style.display = 'none'; document.getElementById('main-ui').style.display = 'flex'; }
    
    function setTheme(theme) {
      document.body.className = theme + '-theme';
    }

    // Rilevamento automatico tema scuro
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme('dark');
    }

    function openCustomPicker() { alert("Qui si apre il modale con la tavolozza colori."); }
    function downloadCard() { html2canvas(document.getElementById('main-card')).then(c => { let a = document.createElement('a'); a.download='card.png'; a.href=c.toDataURL(); a.click(); }); }
  </script>
</body>
</html>
