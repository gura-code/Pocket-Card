<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea la tua Carta Personale</title>
  <!-- Libreria per scaricare la carta come immagine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f1ea; color: #4a3e3d; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    
    h1 { margin-bottom: 20px; font-size: 1.8rem; color: #5a4634; text-align: center; }

    .container { display: flex; flex-wrap: wrap; gap: 30px; max-width: 1000px; width: 100%; justify-content: center; align-items: flex-start; }

    /* FORM DI INPUT */
    .form-container { background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; min-width: 320px; border: 1px solid #e0d8cc; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #6b5744; }
    input[type="text"], input[type="date"], input[type="file"], select { width: 100%; padding: 10px; border: 2px solid #e6dfd5; border-radius: 8px; font-size: 0.9rem; outline: none; background: white; transition: border-color 0.2s; }
    input[type="color"] { width: 100%; height: 42px; border: 2px solid #e6dfd5; border-radius: 8px; cursor: pointer; background: white; padding: 4px; }
    input[type="text"]:focus, input[type="date"]:focus, select:focus { border-color: #a88b70; }

    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }

    /* PULSANTE SCARICA */
    .download-btn { width: 100%; padding: 12px; background-color: #8c7355; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .download-btn:hover { background-color: #705b42; }

    /* ANTEPRIMA CARTA */
    .card-preview { flex: 1; min-width: 340px; display: flex; justify-content: center; align-items: center; padding: 10px; }
    
    /* STILI BASE DELLA CARTA (VERTICALE) */
    .card { 
      width: 340px; 
      height: 500px; 
      border: 3px solid #b89b7d; 
      border-radius: 20px; 
      padding: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      position: relative; 
      overflow: hidden; 
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #ffffff, #f5ebd9);
      color: #333333;
    }

    /* ORIENTAMENTO ORIZZONTALE CORRETTO */
    .card.horizontal {
      width: 500px;
      height: 320px;
      flex-direction: row;
      justify-content: flex-start;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    /* FONT */
    .font-sans { font-family: 'Segoe UI', Roboto, sans-serif; }
    .font-serif { font-family: 'Georgia', 'Times New Roman', serif; }
    .font-mono { font-family: 'Courier New', Courier, monospace; }

    .card-header { font-size: 0.8rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; text-align: center; }
    .card.horizontal .card-header { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; }

    /* AVATAR & FOTO (INGRANDITI) */
    .avatar-container { 
      border: 3px solid #b89b7d; 
      overflow: hidden; 
      background-color: #ffffff; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-bottom: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .card.horizontal .avatar-container { margin-bottom: 0; margin-top: 15px; }
    .avatar-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar-placeholder { color: #a89a8b; font-size: 2.5rem; }

    /* FORME FOTO */
    .shape-circle { border-radius: 50%; }
    .shape-square { border-radius: 16px; }
    .shape-rectangle { border-radius: 8px; }

    /* DIMENSIONI FOTO INGRANDITE */
    .size-small { width: 110px; height: 110px; }
    .size-medium { width: 150px; height: 150px; }
    .size-passport { width: 135px; height: 170px; }

    .card-info { width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .card.horizontal .card-info { text-align: left; align-items: flex-start; margin-top: 20px; }

    .card-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 2px; word-break: break-word; }
    .card-role { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; opacity: 0.85; word-break: break-word; }
    
    .card-details { background: rgba(255, 255, 255, 0.6); padding: 12px; border-radius: 12px; font-size: 0.85rem; border: 1px solid rgba(0,0,0,0.1); text-align: left; width: 100%; }
    .card-details p { margin-bottom: 4px; }
    .card-details p:last-child { margin-bottom: 0; }
    .card-details span.label { font-weight: bold; }

    .card-footer { position: absolute; bottom: 8px; font-size: 0.65rem; opacity: 0.6; letter-spacing: 1px; width: 100%; text-align: center; left: 0; }
  </style>
</head>
<body>

  <h1>📇 Crea la Tua Carta Personale</h1>

  <div class="container">
    <!-- Form Opzioni -->
    <div class="form-container">
      
      <!-- Sezione Dati -->
      <div class="form-group">
        <label for="input-photo">Foto Profilo</label>
        <input type="file" id="input-photo" accept="image/*">
      </div>

      <div class="row">
        <div class="form-group">
          <label for="input-name">Nome e Cognome *</label>
          <input type="text" id="input-name" placeholder="Es. Nome Cognome">
        </div>
        <div class="form-group">
          <label for="input-role">Soprannome / Titolo (Opzionale)</label>
          <input type="text" id="input-role" placeholder="Es. Il Campione">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="input-date">Data</label>
          <input type="date" id="input-date">
        </div>
        <div class="form-group">
          <label for="input-quote">Frase o Nota</label>
          <input type="text" id="input-quote" placeholder="Es. Nota personale">
        </div>
      </div>

      <hr style="margin: 15px 0; border: none; border-top: 1px dashed #e0d8cc;">

      <!-- Sezione Personalizzazione Colori -->
      <div class="row">
        <div class="form-group">
          <label for="input-color-bg">Colore Sfondo</label>
          <input type="color" id="input-color-bg" value="#f5ebd9">
        </div>
        <div class="form-group">
          <label for="input-color-text">Colore Testo</label>
          <input type="color" id="input-color-text" value="#4a3e3d">
        </div>
        <div class="form-group">
          <label for="input-color-box">Colore Riquadro</label>
          <input type="color" id="input-color-box" value="#ffffff">
        </div>
      </div>

      <!-- Sezione Stile e Layout -->
      <div class="row">
        <div class="form-group">
          <label for="select-orientation">Orientamento</label>
          <select id="select-orientation">
            <option value="vertical">Verticale</option>
            <option value="horizontal">Orizzontale</option>
          </select>
        </div>
        <div class="form-group">
          <label for="select-font">Carattere (Font)</label>
          <select id="select-font">
            <option value="font-sans">Classico (Sans-serif)</option>
            <option value="font-serif">Elegante (Serif)</option>
            <option value="font-mono">Moderno (Monospace)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="select-shape">Forma Foto</label>
          <select id="select-shape">
            <option value="shape-square">Quadrata Arrotondata</option>
            <option value="shape-circle">Circolare</option>
            <option value="shape-rectangle">Rettangolare</option>
          </select>
        </div>
        <div class="form-group">
          <label for="select-size">Dimensione Foto</label>
          <select id="select-size">
            <option value="size-medium">Grande (Standard)</option>
            <option value="size-small">Media</option>
            <option value="size-passport">Fototessera / Rettangolare</option>
          </select>
        </div>
      </div>

      <button class="download-btn" id="download-btn">📥 Scarica la Carta (PNG)</button>
    </div>

    <!-- Anteprima Carta -->
    <div class="card-preview">
      <div class="card font-sans" id="card-to-download">
        <div class="card-header" id="card-header-text">Carta Personale</div>
        
        <div class="avatar-container shape-square size-medium" id="avatar-box">
          <span class="avatar-placeholder" id="placeholder-icon">👤</span>
          <img id="card-photo" src="" alt="Foto Profilo">
        </div>

        <div class="card-info">
          <div class="card-name" id="card-name-text">Il Tuo Nome</div>
          <div class="card-role" id="card-role-text" style="display: none;"></div>
          
          <div class="card-details" id="card-details-box">
            <p><span class="label">Data:</span> <span id="card-date-text">--/--/----</span></p>
            <p><span class="label">Nota:</span> <span id="card-quote-text">Aggiungi una frase...</span></p>
          </div>
        </div>

        <div class="card-footer">PASS UFFICIALE • ID-2026</div>
      </div>
    </div>
  </div>

  <script>
    // Elementi Input
    const inputPhoto = document.getElementById('input-photo');
    const inputName = document.getElementById('input-name');
    const inputRole = document.getElementById('input-role');
    const inputDate = document.getElementById('input-date');
    const inputQuote = document.getElementById('input-quote');

    // Elementi Selezioni Colori e Stile
    const inputColorBg = document.getElementById('input-color-bg');
    const inputColorText = document.getElementById('input-color-text');
    const inputColorBox = document.getElementById('input-color-box');
    const selectOrientation = document.getElementById('select-orientation');
    const selectFont = document.getElementById('select-font');
    const selectShape = document.getElementById('select-shape');
    const selectSize = document.getElementById('select-size');

    // Elementi Carta
    const card = document.getElementById('card-to-download');
    const avatarBox = document.getElementById('avatar-box');
    const cardPhoto = document.getElementById('card-photo');
    const placeholderIcon = document.getElementById('placeholder-icon');
    const cardNameText = document.getElementById('card-name-text');
    const cardRoleText = document.getElementById('card-role-text');
    const cardDateText = document.getElementById('card-date-text');
    const cardQuoteText = document.getElementById('card-quote-text');
    const cardDetailsBox = document.getElementById('card-details-box');
    const downloadBtn = document.getElementById('download-btn');

    // Aggiornamento Foto
    inputPhoto.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          cardPhoto.src = event.target.result;
          cardPhoto.style.display = 'block';
          placeholderIcon.style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    });

    // Aggiornamento Nome
    inputName.addEventListener('input', () => { 
      cardNameText.textContent = inputName.value.trim() || 'Il Tuo Nome'; 
    });

    // Aggiornamento Titolo/Ruolo (Opzionale: scompare se vuoto)
    inputRole.addEventListener('input', () => { 
      const roleValue = inputRole.value.trim();
      if (roleValue === "") {
        cardRoleText.style.display = 'none';
      } else {
        cardRoleText.textContent = roleValue;
        cardRoleText.style.display = 'block';
      }
    });

    // Aggiornamento Frase e Data
    inputQuote.addEventListener('input', () => { 
      cardQuoteText.textContent = inputQuote.value.trim() || 'Aggiungi una frase...'; 
    });
    
    inputDate.addEventListener('change', () => {
      if (inputDate.value) {
        const parts = inputDate.value.split('-');
        cardDateText.textContent = `${parts[2]}/${parts[1]}/${parts[0]}`;
      } else {
        cardDateText.textContent = '--/--/----';
      }
    });

    // Gestione Colori Personalizzati
    inputColorBg.addEventListener('input', () => {
      const bgColor = inputColorBg.value;
      card.style.background = `linear-gradient(135deg, #ffffff, ${bgColor})`;
      card.style.borderColor = bgColor;
      avatarBox.style.borderColor = bgColor;
    });

    inputColorText.addEventListener('input', () => {
      const textColor = inputColorText.value;
      card.style.color = textColor;
    });

    inputColorBox.addEventListener('input', () => {
      const boxColor = inputColorBox.value;
      cardDetailsBox.style.backgroundColor = boxColor;
    });

    // Cambio Orientamento (Verticale / Orizzontale)
    selectOrientation.addEventListener('change', () => {
      if (selectOrientation.value === 'horizontal') {
        card.classList.add('horizontal');
      } else {
        card.classList.remove('horizontal');
      }
    });

    // Cambio Font
    selectFont.addEventListener('change', () => {
      card.classList.remove('font-sans', 'font-serif', 'font-mono');
      card.classList.add(selectFont.value);
    });

    // Cambio Forma Foto
    selectShape.addEventListener('change', () => {
      avatarBox.classList.remove('shape-circle', 'shape-square', 'shape-rectangle');
      avatarBox.classList.add(selectShape.value);
    });

    // Cambio Dimensione Foto
    selectSize.addEventListener('change', () => {
      avatarBox.classList.remove('size-small', 'size-medium', 'size-passport');
      avatarBox.classList.add(selectSize.value);
    });

    // Scarica la Carta
    downloadBtn.addEventListener('click', () => {
      html2canvas(card, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'carta-personale.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
</body>
</html>
