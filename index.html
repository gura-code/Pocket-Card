<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- ISTRUZIONI FORZATE PER IL BROWSER -->
  <meta name="color-scheme" content="light">
  
  <title>Pocket Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* SOLUZIONE NUCLEARE: Impedisce forzature di colori e dark mode automatica */
    html, body {
      forced-color-adjust: none !important;
      color-scheme: light !important;
      background-color: #ffffff !important;
      color: #000000 !important;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      /* Impedisce al browser di invertire i colori degli elementi */
      forced-color-adjust: none !important;
    }

    /* Layout di base */
    html, body { 
      width: 100vw; height: 100dvh; 
      overflow: hidden; 
      font-family: 'Quicksand', sans-serif; 
      display: flex; justify-content: center; align-items: center; 
    }

    .phone-wrapper { 
      width: 100vw; height: 100dvh; 
      background-color: #ffffff !important; 
      position: relative; overflow: hidden; display: flex; flex-direction: column; 
    }

    @media (min-width: 500px) { 
      .phone-wrapper { 
        width: 380px; height: 780px; 
        border-radius: 40px; border: 8px solid #000000; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
      } 
    }

    /* SPLASH SCREEN */
    #splash { 
      position: absolute; top:0; left:0; width:100%; height:100%; 
      background-color: #ffffff !important; z-index: 100; display: flex; overflow: hidden;
    }
    
    .bg-scrolling { display: flex; width: 100%; height: 100%; opacity: 0.85; pointer-events: none; }
    .col { flex: 1; display: flex; flex-direction: column; }
    .up { animation: scrollUp 22s linear infinite; }
    .down { animation: scrollDown 22s linear infinite; }
    @keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes scrollDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }

    .sticker { width: 75px; height: 75px; margin: 15px auto; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .sticker img { width: 100%; height: 100%; object-fit: contain; }

    .content-overlay { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      z-index: 10; background: rgba(255, 255, 255, 0.75) !important; 
    }

    .logo-main { 
      font-size: 3.5rem; line-height: 0.9; font-weight: 800; 
      color: #000000 !important; margin-bottom: 40px; text-align: center;
      letter-spacing: -2px;
    }

    .btn-start { 
      background-color: #000000 !important; color: #ffffff !important; 
      border: none; padding: 15px 50px; border-radius: 30px; 
      font-weight: 800; font-size: 1.3rem; cursor: pointer;
    }

    /* UI PRINCIPALE */
    .main-ui { 
      display: none; width: 100%; height: 100%; flex-direction: column; 
      padding: 20px; justify-content: space-between; align-items: center; 
      background-color: #ffffff !important;
    }

    .card-canvas-area { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }

    /* CARD */
    .card { 
      width: 320px; max-width: 85vw; height: 180px; 
      background-color: #ffffff !important; 
      border: 3px solid #000000 !important; 
      border-radius: 20px; padding: 12px; display: flex; gap: 12px; 
      align-items: center; box-sizing: border-box; margin: 0 auto;
    }

    .card-photo-box { height: 100%; max-width: 130px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .placeholder-box { 
      width: 100px; height: 100%; border: 2px dashed #000000 !important; 
      border-radius: 10px; display: flex; align-items: center; justify-content: center; 
      background-color: #f0f0f0 !important; font-size: 0.75rem; color: #666666 !important; font-weight: 700; 
    }
    .card-photo-box img { max-height: 156px; max-width: 130px; border: 2px solid #000000 !important; border-radius: 8px; }
    
    .card-info-box { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; overflow: hidden; gap: 4px; }
    .card-title { font-size: 1.1rem; font-weight: 800; color: #000000 !important; }
    .card-voto { font-size: 0.85rem; font-weight: 800; color: #555555 !important; }
    .card-review { font-size: 0.75rem; color: #333333 !important; font-style: italic; line-height: 1.2; }

    /* CARD - TEMA NERO */
    .card.dark-theme { background-color: #000000 !important; border-color: #ffffff !important; }
    .card.dark-theme .card-title { color: #ffffff !important; }
    .card.dark-theme .card-voto { color: #cccccc !important; }
    .card.dark-theme .card-review { color: #aaaaaa !important; }
    .card.dark-theme .placeholder-box { border-color: #ffffff !important; background-color: #1a1a1a !important; color: #aaaaaa !important; }
    .card.dark-theme .card-photo-box img { border-color: #ffffff !important; }

    /* PALLINE COLORI */
    .color-picker { display: flex; gap: 12px; align-items: center; justify-content: center; }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #000000 !important; }
    .dot-white { background-color: #ffffff !important; }
    .dot-black { background-color: #000000 !important; }
    .color-dot.active { box-shadow: 0 0 0 3px #000000 !important; }
    
    .btn-download { width: 100%; background-color: #000000 !important; color: #ffffff !important; padding: 14px; border-radius: 12px; font-weight: 800; text-align: center; margin-bottom: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div id="splash">
      <div class="bg-scrolling">
        <div class="col up" id="col1"></div>
        <div class="col down" id="col2"></div>
        <div class="col up" id="col3"></div>
      </div>
      <div class="content-overlay">
        <div class="logo-main"><div>Pocket</div><div>Review</div></div>
        <button class="btn-start" onclick="startApp()">Start</button>
      </div>
    </div>

    <div class="main-ui" id="main-ui">
      <div style="font-weight:800; margin-top:10px; font-size: 1.2rem;">New Entry</div>
      <div class="card-canvas-area">
        <div class="card" id="main-card">
          <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
            <div id="placeholder" class="placeholder-box">+ Photo</div>
            <img id="card-photo-img" style="display:none;" alt="Photo">
          </div>
          <div class="card-info-box">
            <div class="card-title editable" contenteditable="true">Name</div>
            <div class="card-voto editable" contenteditable="true">Rating</div>
            <div class="card-review editable" contenteditable="true">Review...</div>
          </div>
        </div>
        <div class="color-picker">
          <div class="color-dot dot-white active" onclick="setCardTheme('light')"></div>
          <div class="color-dot dot-black" onclick="setCardTheme('dark')"></div>
        </div>
      </div>
      <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">
      <div class="btn-download" onclick="downloadCard()">Download Card</div>
    </div>
  </div>

  <script>
    const images = [
      "1000072971-removebg-preview.png", "1000072972-removebg-preview.png",
      "1000072974-removebg-preview.png", "1000072977-removebg-preview.png",
      "1000072978-removebg-preview.png", "1000072979-removebg-preview.png",
      "1000072980-removebg-preview.png", "1000072981-removebg-preview.png",
      "1000072982-removebg-preview.png", "1000072983-removebg-preview.png",
      "1000072985-removebg-preview.png", "1000072986-removebg-preview.png",
      "1000072987-removebg-preview.png", "1000072988-removebg-preview.png",
      "1000072989-removebg-preview.png", "1000072990-removebg-preview.png"
    ];

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderColumn(colId) {
      const colEl = document.getElementById(colId);
      const shuffled = shuffleArray(images);
      let htmlContent = '';
      shuffled.forEach(imgName => { htmlContent += `<div class="sticker"><img src="${imgName}" alt="sticker"></div>`; });
      shuffled.forEach(imgName => { htmlContent += `<div class="sticker"><img src="${imgName}" alt="sticker"></div>`; });
      colEl.innerHTML = htmlContent;
    }

    renderColumn('col1'); renderColumn('col2'); renderColumn('col3');

    function startApp() { document.getElementById('splash').style.display = 'none'; document.getElementById('main-ui').style.display = 'flex'; }
    
    function loadPhoto(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-photo-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(file);
    }

    function setCardTheme(theme) {
      const card = document.getElementById('main-card');
      const dots = document.querySelectorAll('.color-dot');
      if (theme === 'dark') {
        card.classList.add('dark-theme');
        dots[0].classList.remove('active');
        dots[1].classList.add('active');
      } else {
        card.classList.remove('dark-theme');
        dots[0].classList.add('active');
        dots[1].classList.remove('active');
      }
    }

    function downloadCard() {
      const card = document.getElementById('main-card');
      const editables = card.querySelectorAll('.editable');
      editables.forEach(el => {
        const text = el.innerText.trim();
        if (text === 'Name' || text === 'Rating' || text === 'Review...') {
          el.dataset.oldText = el.innerText;
          el.innerText = '';
        }
      });

      html2canvas(card, { scale: 3, backgroundColor: null, useCORS: true }).then(canvas => {
        editables.forEach(el => {
          if (el.dataset.oldText) {
            el.innerText = el.dataset.oldText;
            delete el.dataset.oldText;
          }
        });
        const link = document.createElement('a');
        link.download = 'card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
