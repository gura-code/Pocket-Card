<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea la tua Carta Personale</title>
  <!-- Libreria per scaricare la carta come immagine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f0f0; color: #111111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 600px; }

    /* CONTROLLI IN ALTO */
    .controls-bar { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .btn-action { padding: 10px 16px; background: #ffffff; border: 2px solid #111; border-radius: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
    .btn-action:hover { background: #111; color: #fff; }
    .btn-download { background: #111; color: #fff; }
    .btn-download:hover { background: #333; }

    /* STILI BASE DELLA CARTA (BIANCO E NERO INIZIALE - VERTICALE 315x500) */
    .card { 
      width: 315px; 
      height: 500px; 
      border: 3px solid #111111; 
      border-radius: 20px; 
      padding: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      position: relative; 
      overflow: hidden; 
      transition: width 0.3s, height 0.3s;
      background: #ffffff;
      color: #111111;
      user-select: none;
    }

    /* ORIENTAMENTO ORIZZONTALE ESATTO (500x315) */
    .card.horizontal {
      width: 500px;
      height: 315px;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 25px 20px 20px 20px;
    }

    /* TITOLO CLICCABILE PER CAMBIARE SFONDO */
    .card-header { 
      font-size: 0.85rem; 
      font-weight: bold; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      margin-bottom: 15px; 
      text-align: center; 
      cursor: pointer;
      padding: 4px 8px;
      border: 1px dashed transparent;
      border-radius: 6px;
    }
    .card-header:hover { border-color: #111; background: rgba(0,0,0,0.05); }
    .card.horizontal .card-header { position: absolute; top: 12px; left: 0; width: 100%; text-align: center; }

    /* FOTO PROFILE CLICCABILE */
    .avatar-container { 
      width: 150px;
      height: 150px;
      border: 3px solid #111111; 
      border-radius: 16px;
      overflow: hidden; 
      background-color: #f9f9f9; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      margin-bottom: 15px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .avatar-container:hover { transform: scale(1.02); opacity: 0.9; }
    .card.horizontal .avatar-container { margin-bottom: 0; margin-top: 15px; }
    .avatar-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar-placeholder { font-size: 2.2rem; }
    .avatar-hint { font-size: 0.65rem; font-weight: bold; margin-top: 4px; opacity: 0.6; text-align: center; }

    /* INFO TESTI MODIFICABILI SULLA CARTA */
    .card-info { width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .card.horizontal .card-info { text-align: left; align-items: flex-start; margin-top: 20px; padding-left: 10px; }

    .editable { outline: none; border: 1px dashed transparent; border-radius: 6px; padding: 2px 6px; transition: border-color 0.2s; }
    .editable:hover, .editable:focus { border-color: #111111; background: rgba(255,255,255,0.5); }

    .card-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; word-break: break-word; line-height: 1.2; min-width: 100px; }
    
    /* RIQUADRO DATI CLICCABILE/MODIFICABILE */
    .card-details { 
      background: #ffffff; 
      padding: 12px; 
      border-radius: 12px; 
      font-size: 0.85rem; 
      border: 2px solid #111111; 
      text-align: left; 
      width: 100%; 
      cursor: pointer;
    }
    .card-details p { margin-bottom: 4px; display: flex; gap: 6px; }
    .card-details p:last-child { margin-bottom: 0; }
    .card-details span.label { font-weight: bold; }

    .card-footer { position: absolute; bottom: 8px; font-size: 0.65rem; opacity: 0.5; letter-spacing: 1px; width: 100%; text-align: center; left: 0; }

    /* INPUT NASCOSTI PER FOTO E COLORI */
    #hidden-file-input, #hidden-bg-color, #hidden-box-color { display: none; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Pulsanti di azione in alto -->
    <div class="controls-bar">
      <button class="btn-action" id="rotate-btn">🔄 Ruota Carta</button>
      <button class="btn-action btn-download" id="download-btn">📥 Scarica Carta (PNG)</button>
    </div>

    <!-- Input Nascosti -->
    <input type="file" id="hidden-file-input" accept="image/*">
    <input type="color" id="hidden-bg-color" value="#ffffff">
    <input type="color" id="hidden-box-color" value="#ffffff">

    <!-- La Carta -->
    <div class="card" id="card-to-download">
      <div class="card-header" id="card-header-text" title="Clicca per cambiare colore dello sfondo">CARTA PERSONALE 🎨</div>
      
      <!-- Clicca qui per la foto -->
      <div class="avatar-container" id="avatar-box" title="Clicca per caricare la foto">
        <span class="avatar-placeholder" id="placeholder-icon">📸</span>
        <span class="avatar-hint" id="placeholder-text">Inserisci Foto</span>
        <img id="card-photo" src="" alt="Foto Profilo">
      </div>

      <div class="card-info">
        <!-- Nome modificabile direttamente cliccandoci sopra -->
        <div class="card-name editable" contenteditable="true" id="card-name-text" title="Clicca per modificare il nome">Nome Cognome</div>
        
        <!-- Riquadro Dati -->
        <div class="card-details" id="card-details-box" title="Doppio clic per cambiare colore del riquadro">
          <p><span class="label">Data:</span> <span class="editable" contenteditable="true" id="card-date-text">01/01/2026</span></p>
          <p><span class="label">Nota:</span> <span class="editable" contenteditable="true" id="card-quote-text">Scrivi una nota qui...</span></p>
        </div>
      </div>

      <div class="card-footer">PASS UFFICIALE • ID-2026</div>
    </div>
  </div>

  <script>
    // Elementi
    const card = document.getElementById('card-to-download');
    const rotateBtn = document.getElementById('rotate-btn');
    const downloadBtn = document.getElementById('download-btn');
    
    const avatarBox = document.getElementById('avatar-box');
    const cardPhoto = document.getElementById('card-photo');
    const placeholderIcon = document.getElementById('placeholder-icon');
    const placeholderText = document.getElementById('placeholder-text');
    
    const cardHeader = document.getElementById('card-header-text');
    const cardDetailsBox = document.getElementById('card-details-box');
    
    const hiddenFileInput = document.getElementById('hidden-file-input');
    const hiddenBgColor = document.getElementById('hidden-bg-color');
    const hiddenBoxColor = document.getElementById('hidden-box-color');

    // 1. CARICAMENTO FOTO (Cliccando sulla foto)
    avatarBox.addEventListener('click', () => {
      hiddenFileInput.click();
    });

    hiddenFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          cardPhoto.src = event.target.result;
          cardPhoto.style.display = 'block';
          placeholderIcon.style.display = 'none';
          placeholderText.style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    });

    // 2. CAMBIO COLORE SFONDO (Cliccando sul titolo "CARTA PERSONALE")
    cardHeader.addEventListener('click', () => {
      hiddenBgColor.click();
    });

    hiddenBgColor.addEventListener('input', () => {
      const color = hiddenBgColor.value;
      card.style.background = color;
    });

    // 3. CAMBIO COLORE RIQUADRO DATI (Doppio clic sul riquadro dati)
    cardDetailsBox.addEventListener('dblclick', () => {
      hiddenBoxColor.click();
    });

    hiddenBoxColor.addEventListener('input', () => {
      const color = hiddenBoxColor.value;
      cardDetailsBox.style.backgroundColor = color;
    });

    // 4. RUOTA CARTA (Verticale / Orizzontale)
    rotateBtn.addEventListener('click', () => {
      card.classList.toggle('horizontal');
    });

    // 5. SCARICA CARTA
    downloadBtn.addEventListener('click', () => {
      // Rimuove temporaneamente le evidenziazioni dei testi durante il download
      document.querySelectorAll('.editable').forEach(el => el.blur());
      
      html2canvas(card, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'carta-personale.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
</body>
</html>
