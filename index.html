<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Media Card</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* VARIABILI PER IL TEMA AUTOMATICO */
    :root {
      --bg: #ffffff;
      --text: #000000;
      --card-bg: #ffffff;
      --border: #000000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #ffffff;
        --card-bg: #1e1e1e;
        --border: #ffffff;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 20px;
    }

    /* CARD STYLE */
    .card {
      width: 100%;
      max-width: 400px;
      height: 220px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      display: flex;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .image-side {
      width: 40%;
      height: 100%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-right: 2px solid var(--border);
    }

    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* MANTIENE PROPORZIONI */
      display: none;
    }

    .text-side {
      width: 60%;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .title { font-size: 1.2rem; font-weight: bold; }
    .rating { font-size: 0.9rem; opacity: 0.7; }
    .review { font-size: 0.8rem; font-style: italic; overflow-y: auto; flex-grow: 1; }

    /* CONTROLLI */
    .controls { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    input, textarea { 
      padding: 10px; background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    button { 
      padding: 12px; background: var(--text); color: var(--bg); border: none; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- ANTEPRIMA -->
  <div class="card" id="card">
    <div class="image-side" onclick="document.getElementById('file-input').click()">
      <span id="placeholder">Poster</span>
      <img id="card-img" alt="Poster">
    </div>
    <div class="text-side">
      <div class="title" id="out-title">Titolo</div>
      <div class="rating" id="out-rating">Voto: -</div>
      <div class="review" id="out-review">La tua opinione...</div>
    </div>
  </div>

  <!-- INPUTS -->
  <div class="controls">
    <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">
    <input type="text" placeholder="Titolo" oninput="document.getElementById('out-title').innerText = this.value">
    <input type="text" placeholder="Voto" oninput="document.getElementById('out-rating').innerText = 'Voto: ' + this.value">
    <textarea placeholder="Recensione" oninput="document.getElementById('out-review').innerText = this.value" style="height: 80px; resize:none;"></textarea>
    <button onclick="downloadCard()">Scarica Immagine</button>
  </div>

  <script>
    function loadPhoto(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(e.target.files[0]);
    }

    function downloadCard() {
      html2canvas(document.getElementById('card'), { 
        scale: 2,
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--card-bg') 
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'media-journal.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
