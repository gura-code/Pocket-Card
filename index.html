<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Anime ID Card Creator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { background: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 40px; font-family: 'Segoe UI', sans-serif; }
    
    .toolbar { display: flex; gap: 15px; margin-bottom: 20px; }
    button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; background: #333; color: white; }

    /* CARTA - Il cuore di tutto */
    .card {
      width: 350px; height: 500px; 
      background: #ffffff; border: 4px solid #000; border-radius: 15px;
      padding: 20px; display: flex; flex-direction: column; align-items: center;
      position: relative; transition: all 0.3s ease;
      cursor: pointer; /* Indica che si può cliccare ovunque per cambiare colore */
    }
    .card.horizontal { width: 500px; height: 350px; flex-direction: row; justify-content: flex-start; gap: 20px; }

    /* FOTO */
    .photo-area { 
      width: 180px; height: 180px; border: 3px solid #000; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: #ddd; margin-bottom: 15px; flex-shrink: 0;
    }
    .photo-area img { width: 100%; height: 100%; object-fit: cover; }
    
    /* TESTI MODIFICABILI */
    [contenteditable="true"] { outline: none; border: 1px dashed transparent; padding: 2px; }
    [contenteditable="true"]:hover { border: 1px dashed #666; }
    
    .title { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
    .name { font-size: 1.8rem; font-weight: 900; }
    .rank { font-size: 1rem; color: #555; font-style: italic; margin-bottom: 20px; }
    
    .data-box { width: 100%; border-top: 2px solid #000; padding-top: 15px; font-size: 0.9rem; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="toolbar">
    <button onclick="toggleLayout()">🔄 Ruota Carta</button>
    <button onclick="downloadCard()">📥 Scarica PNG</button>
  </div>

  <input type="file" id="fileInput" style="display:none" accept="image/*">
  <input type="color" id="colorInput" style="display:none">

  <!-- La Carta -->
  <div class="card" id="card" onclick="changeColor()">
    <div class="title" contenteditable="true">Gilda degli Avventurieri</div>
    
    <div class="photo-area" id="photoArea" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">
      <span id="placeholder">📸 Carica</span>
      <img id="imgDisplay">
    </div>

    <div style="text-align: center;">
      <div class="name" contenteditable="true">Nome Personaggio</div>
      <div class="rank" contenteditable="true">Classe / Rank S</div>
      <div class="data-box" contenteditable="true">
        ID: 001<br>
        Data Nascita: 12/08<br>
        Abilità: Sconosciuta
      </div>
    </div>
  </div>

  <script>
    // Caricamento Foto
    document.getElementById('fileInput').onchange = e => {
      const reader = new FileReader();
      reader.onload = r => {
        document.getElementById('imgDisplay').src = r.target.result;
        document.getElementById('placeholder').style.display = 'none';
      };
      reader.readAsDataURL(e.target.files[0]);
    };

    // Cambio Colore Sfondo
    function changeColor() {
      document.getElementById('colorInput').click();
    }
    document.getElementById('colorInput').oninput = e => {
      document.getElementById('card').style.background = e.target.value;
    };

    // Layout
    function toggleLayout() {
      document.getElementById('card').classList.toggle('horizontal');
    }

    // Download
    function downloadCard() {
      html2canvas(document.getElementById('card')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'mia-carta-anime.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
