<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Pocket Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background-color: #ffffff; color: #000000; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; }
    .phone-wrapper { width: 100vw; height: 100dvh; background-color: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    @media (min-width: 500px) { .phone-wrapper { width: 380px; height: 780px; max-height: 92vh; border-radius: 40px; border: 8px solid #000000; box-shadow: 0 20px 40px rgba(0,0,0,0.3); } }

    /* SPLASH SCREEN */
    #splash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 100; display: flex; overflow: hidden; }
    .bg-scrolling { display: flex; width: 100%; height: 100%; opacity: 0.85; pointer-events: none; }
    .col { flex: 1; display: flex; flex-direction: column; }
    .up { animation: scrollUp 22s linear infinite; }
    .down { animation: scrollDown 22s linear infinite; }
    @keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes scrollDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }
    .sticker { width: 75px; height: 75px; margin: 15px auto; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .sticker img { width: 100%; height: 100%; object-fit: contain; }
    .content-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: rgba(255, 255, 255, 0.75); }
    .logo-main { font-size: 4.5rem; line-height: 0.88; font-weight: 800; color: #000000; margin-bottom: 50px; text-align: center; letter-spacing: -3px; }
    .btn-start { background-color: #000000; color: #ffffff; border: none; padding: 15px 40px; border-radius: 30px; font-weight: 800; font-size: 1.2rem; cursor: pointer; }

    /* UI PRINCIPALE */
    .main-ui { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; justify-content: space-between; align-items: center; background-color: #ffffff; }
    .card-canvas-area { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; position: relative; }

    /* CARD */
    .card { width: 320px; height: 180px; background-color: #ffffff; border: 3px solid #000000; border-radius: 20px; padding: 12px; display: flex; gap: 12px; align-items: center; box-sizing: border-box; transition: all 0.2s ease; }
    .card-photo-box { height: 100%; max-height: 156px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .placeholder-box { width: 100px; height: 156px; border: 2px dashed inherit; border-radius: 12px; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.05); font-size: 12px; font-weight: 700; }
    .card-photo-box img { max-height: 156px; max-width: 140px; border: 2px dashed inherit; border-radius: 12px; display: block; }
    .card-info-box { flex: 1; height: 156px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; gap: 4px; margin-left: 4px; }
    .editable { outline: none; }
    .card-title { font-size: 16px; font-weight: 800; }
    .card-voto { font-size: 13px; font-weight: 800; }
    .card-review { font-size: 11px; font-style: italic; }

    /* CONTROLLI */
    .color-picker { display: flex; gap: 12px; align-items: center; justify-content: center; }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #000000; }
    .color-dot.active { box-shadow: 0 0 0 3px #000000; }
    .color-sub-menu { display: flex; flex-wrap: wrap; gap: 6px; background: #111111; padding: 6px; border-radius: 14px; justify-content: center; }
    .menu-btn { background: #222222; color: #ffffff; border: 1px solid #333333; padding: 8px; border-radius: 10px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .btn-download { width: 100%; background-color: #000000; color: #ffffff; padding: 14px; border-radius: 12px; font-weight: 800; text-align: center; cursor: pointer; }

    /* MODALE */
    .picker-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; display: none; justify-content: center; align-items: flex-end; padding-bottom: 20px; }
    .picker-container { width: 340px; background: #1c1c1e; border-radius: 28px; padding: 16px; color: #ffffff; display: flex; flex-direction: column; gap: 14px; }
    .grid-view { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; height: 200px; }
    .grid-cell { border-radius: 3px; cursor: pointer; }
    .picker-actions { display: flex; justify-content: space-between; border-top: 1px solid #2c2c2e; padding-top: 10px; }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div id="splash">
      <div class="bg-scrolling"><div class="col up" id="col1"></div><div class="col down" id="col2"></div><div class="col up" id="col3"></div></div>
      <div class="content-overlay">
        <div class="logo-main"><div>Pocket</div><div>Card</div></div>
        <button class="btn-start" onclick="startApp()">Start Creating</button>
      </div>
    </div>

    <div class="main-ui" id="main-ui">
      <div style="font-weight:800; margin-top:10px; font-size: 1.2rem;">Create Card</div>
      
      <div class="card-canvas-area">
        <div class="card light-card" id="main-card">
          <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
            <div id="placeholder" class="placeholder-box">+ Photo</div>
            <img id="card-photo-img" style="display:none;" alt="Photo">
          </div>
          <div class="card-info-box">
            <div class="card-title editable" contenteditable="true" data-placeholder="Title / Name...">Title / Name...</div>
            <div class="card-voto editable" contenteditable="true" data-placeholder="Rating / Genre / Role...">Rating / Genre / Role...</div>
            <div class="card-review editable" contenteditable="true" data-placeholder="Review / Plot / Notes...">Review / Plot / Notes...</div>
          </div>
        </div>

        <div class="color-picker">
          <div class="color-dot" style="background:#ffffff" onclick="setCardTheme('light')"></div>
          <div class="color-dot" style="background:#000000" onclick="setCardTheme('dark')"></div>
        </div>

        <div class="color-sub-menu">
          <button class="menu-btn" onclick="openCustomPicker('bg')">Card Color</button>
          <button class="menu-btn" onclick="openCustomPicker('text')">Text Color</button>
          <button class="menu-btn" onclick="openCustomPicker('line')">Card Border</button>
          <button class="menu-btn" onclick="openCustomPicker('photo-border')">Photo Border</button>
        </div>
      </div>

      <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">
      <div class="btn-download" onclick="downloadCard()">Download Card</div>
    </div>

    <!-- MODALE -->
    <div class="picker-modal-overlay" id="picker-modal">
      <div class="picker-container">
        <div id="border-toggle-container" style="display:none; border-bottom:1px solid #333; padding-bottom:10px;">
          <button class="menu-btn" style="width:100%" id="btn-toggle-border" onclick="toggleBorder()">Toggle Border ON/OFF</button>
        </div>
        <div class="grid-view" id="picker-grid"></div>
        <div class="picker-actions">
          <div style="cursor:pointer" onclick="closePicker()">Cancel</div>
          <div style="cursor:pointer" onclick="applyPickerColor()">Done</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTarget = 'bg';
    let cardBorderVisible = true;
    let photoBorderVisible = true;

    function startApp() { document.getElementById('splash').style.display = 'none'; document.getElementById('main-ui').style.display = 'flex'; }

    function setCardTheme(theme) {
      const card = document.getElementById('main-card');
      if(theme === 'dark') {
        card.style.backgroundColor = '#000000';
        card.style.borderColor = '#ffffff';
        card.querySelectorAll('.editable').forEach(el => el.style.color = '#ffffff');
      } else {
        card.style.backgroundColor = '#ffffff';
        card.style.borderColor = '#000000';
        card.querySelectorAll('.editable').forEach(el => el.style.color = '#000000');
      }
    }

    function openCustomPicker(target) {
      currentTarget = target;
      const toggle = document.getElementById('border-toggle-container');
      toggle.style.display = (target === 'line' || target === 'photo-border') ? 'block' : 'none';
      initGrid();
      document.getElementById('picker-modal').style.display = 'flex';
    }

    function toggleBorder() {
      const card = document.getElementById('main-card');
      const placeholder = document.getElementById('placeholder');
      const img = document.getElementById('card-photo-img');

      if(currentTarget === 'line') {
        cardBorderVisible = !cardBorderVisible;
        card.style.borderStyle = cardBorderVisible ? 'solid' : 'none';
      } else if(currentTarget === 'photo-border') {
        photoBorderVisible = !photoBorderVisible;
        placeholder.style.borderStyle = photoBorderVisible ? 'dashed' : 'none';
        img.style.borderStyle = photoBorderVisible ? 'dashed' : 'none';
      }
    }

    function initGrid() {
      const grid = document.getElementById('picker-grid');
      grid.innerHTML = '';
      for(let i=0; i<100; i++) {
        let cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.style.backgroundColor = `hsl(${i*3.6}, 70%, 50%)`;
        cell.onclick = () => { window.selectedColor = cell.style.backgroundColor; };
        grid.appendChild(cell);
      }
    }

    function applyPickerColor() {
      const card = document.getElementById('main-card');
      const color = window.selectedColor || '#000000';
      if(currentTarget === 'bg') card.style.backgroundColor = color;
      if(currentTarget === 'text') card.querySelectorAll('.editable').forEach(el => el.style.color = color);
      if(currentTarget === 'line') card.style.borderColor = color;
      if(currentTarget === 'photo-border') {
        document.getElementById('placeholder').style.borderColor = color;
        document.getElementById('card-photo-img').style.borderColor = color;
      }
      closePicker();
    }

    function closePicker() { document.getElementById('picker-modal').style.display = 'none'; }
    function loadPhoto(e) { 
      const reader = new FileReader();
      reader.onload = (ev) => { 
        document.getElementById('card-photo-img').src = ev.target.result;
        document.getElementById('card-photo-img').style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      };
      reader.readAsDataURL(e.target.files[0]);
    }
    function downloadCard() { html2canvas(document.getElementById('main-card')).then(c => { let a = document.createElement('a'); a.download='card.png'; a.href=c.toDataURL(); a.click(); }); }
  </script>
</body>
</html>
