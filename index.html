<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light">
  
  <title>Pocket Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    html, body { 
      width: 100vw; 
      height: 100dvh; 
      overflow: hidden; 
      background-color: #ffffff; 
      color: #000000;
      font-family: 'Quicksand', sans-serif; 
    }

    .phone-wrapper { 
      width: 100vw; height: 100dvh; 
      background-color: #ffffff; 
      position: relative; overflow: hidden; display: flex; flex-direction: column; 
    }

    #splash { 
      position: absolute; top:0; left:0; width:100%; height:100%; 
      background-color: #ffffff; z-index: 100; display: flex; 
    }
    
    .content-overlay { 
      position: absolute; width: 100%; height: 100%; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      z-index: 10; background: rgba(255, 255, 255, 0.85); 
    }

    .logo-main { 
      font-size: 3.5rem; line-height: 0.9; font-weight: 800; 
      color: #000000; margin-bottom: 40px; text-align: center;
      letter-spacing: -2px;
    }

    .btn-start { 
      background-color: #000000; color: #ffffff; 
      border: none; padding: 15px 50px; border-radius: 30px; 
      font-weight: 800; font-size: 1.3rem; cursor: pointer;
    }

    .main-ui { 
      display: none; width: 100%; height: 100%; flex-direction: column; 
      padding: 20px; justify-content: space-between; align-items: center; 
      background-color: #ffffff;
    }

    .card-canvas-area { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }

    .card { 
      width: 320px; height: 180px; 
      background-color: #ffffff; 
      border: 3px solid #000000; 
      border-radius: 20px; 
      padding: 12px; display: flex; gap: 12px; 
      align-items: center;
      box-sizing: border-box;
    }

    .card-photo-box { height: 100%; max-width: 130px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .placeholder-box { width: 100px; height: 100%; border: 2px dashed #000000; border-radius: 10px; display: flex; align-items: center; justify-content: center; background-color: #f0f0f0; font-size: 0.75rem; color: #666666; font-weight: 700; }
    .card-photo-box img { max-height: 156px; max-width: 130px; border: 2px solid #000000; border-radius: 8px; }
    
    .card-info-box { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; overflow: hidden; gap: 4px; }
    .editable { outline: none; }
    .card-title { font-size: 1.1rem; font-weight: 800; color: #000000; word-break: break-word; }
    .card-voto { font-size: 0.85rem; font-weight: 800; color: #555555; }
    .card-review { font-size: 0.75rem; color: #333333; font-style: italic; line-height: 1.2; word-break: break-word; }
    
    .btn-download { width: 100%; background-color: #000000; color: #ffffff; padding: 14px; border-radius: 12px; font-weight: 800; text-align: center; margin-bottom: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div id="splash">
      <div class="content-overlay">
        <div class="logo-main">
          <div>Pocket</div>
          <div>Review</div>
        </div>
        <button class="btn-start" onclick="startApp()">Start</button>
      </div>
    </div>

    <div class="main-ui" id="main-ui">
      <div style="font-weight:800; margin-top:10px; font-size: 1.2rem;">New Entry</div>
      <div class="card-canvas-area">
        <div class="card" id="main-card">
          <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
            <div id="placeholder" class="placeholder-box">+ Photo</div>
            <img id="card-photo-img" style="display:none;" alt="Photo">
          </div>
          <div class="card-info-box">
            <div class="card-title editable" contenteditable="true">Name</div>
            <div class="card-voto editable" contenteditable="true">Rating</div>
            <div class="card-review editable" contenteditable="true">Review...</div>
          </div>
        </div>
      </div>
      <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">
      <div class="btn-download" onclick="downloadCard()">Download Card</div>
    </div>
  </div>

  <script>
    function startApp() { document.getElementById('splash').style.display = 'none'; document.getElementById('main-ui').style.display = 'flex'; }
    
    function loadPhoto(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-photo-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(file);
    }

    function downloadCard() {
      const card = document.getElementById('main-card');
      const editables = card.querySelectorAll('.editable');

      // Pulisce il testo predefinito prima del download
      editables.forEach(el => {
        const text = el.innerText.trim();
        if (text === 'Name' || text === 'Rating' || text === 'Review...') {
          el.dataset.oldText = el.innerText;
          el.innerText = '';
        }
      });

      // Genera l'immagine con sfondo trasparente esternamente agli angoli arrotondati
      html2canvas(card, { 
        scale: 3, 
        backgroundColor: null, 
        useCORS: true 
      }).then(canvas => {
        // Ripristina testo
        editables.forEach(el => {
          if (el.dataset.oldText) {
            el.innerText = el.dataset.oldText;
            delete el.dataset.oldText;
          }
        });

        const link = document.createElement('a');
        link.download = 'card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
