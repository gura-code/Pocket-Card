<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Card</title>
  <!-- Carica le librerie necessarie -->
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* Stili mantenuti uguali per non rompere il design */
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { width: 320px; height: 180px; background: white; border: 3px solid black; border-radius: 20px; padding: 15px; display: flex; gap: 10px; align-items: center; }
    .card-photo-box { width: 100px; height: 100%; border: 2px dashed black; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #card-photo-img { max-width: 100%; max-height: 100%; display: none; }
    .card-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .editable { outline: none; border-bottom: 1px solid #ccc; }
    .btn { margin-top: 20px; padding: 15px 30px; background: black; color: white; border-radius: 20px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
      <span id="label">+ Photo</span>
      <img id="card-photo-img">
    </div>
    <div class="card-info">
      <div class="editable" contenteditable="true">Titolo</div>
      <div class="editable" contenteditable="true">Voto</div>
    </div>
  </div>

  <input type="file" id="file-input" style="display:none" accept="image/gif" onchange="loadGif(event)">
  <div class="btn" onclick="generateVideo()">Download Card</div>

  <script>
    let gifData = null;
    let gifWidth = 0, gifHeight = 0;

    function loadGif(e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = async (e) => {
        const buffer = new Uint8Array(e.target.result);
        gifData = new omggif.GifReader(buffer);
        gifWidth = gifData.width;
        gifHeight = gifData.height;
        document.getElementById('card-photo-img').src = URL.createObjectURL(file);
        document.getElementById('card-photo-img').style.display = 'block';
        document.getElementById('label').style.display = 'none';
      };
      reader.readAsArrayBuffer(file);
    }

    async function generateVideo() {
      if (!gifData) return alert("Carica prima una GIF!");
      
      const card = document.getElementById('main-card');
      const canvas = document.createElement('canvas');
      canvas.width = 640; canvas.height = 360; // Risoluzione video
      const ctx = canvas.getContext('2d');
      
      // 1. Cattura il design della carta come immagine statica
      const cardImg = await html2canvas(card).then(c => c);
      
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'card.mp4';
        a.click();
      };
      recorder.start();

      // 2. Disegna fotogramma per fotogramma
      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = gifWidth; frameCanvas.height = gifHeight;
      const frameCtx = frameCanvas.getContext('2d');
      
      for (let i = 0; i < gifData.numFrames(); i++) {
        // Disegna sfondo carta
        ctx.drawImage(cardImg, 0, 0, 640, 360);
        
        // Decodifica fotogramma GIF
        const imageData = frameCtx.createImageData(gifWidth, gifHeight);
        gifData.decodeAndBlitFrameRGBA(i, imageData.data);
        frameCtx.putImageData(imageData, 0, 0);
        
        // Disegna GIF sopra
        ctx.drawImage(frameCanvas, 50, 50, 150, 150);
        
        // Aspetta un momento per il video
        await new Promise(r => setTimeout(r, 100));
      }
      recorder.stop();
    }
  </script>
</body>
</html>
