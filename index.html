<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Palette Colori Esatta</title>
  <style>
    .color-picker-container {
      background-color: #2b2b2b;
      padding: 12px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 1px; /* Spazio millimetrico tra le tessere */
      width: 360px;
      height: 300px;
      background-color: #000;
    }

    .color-tile {
      width: 100%;
      height: 100%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .color-tile:hover {
      outline: 2px solid #fff;
      z-index: 10;
      transform: scale(1.15);
    }
  </style>
</head>
<body>

<div class="color-picker-container">
  <div class="color-grid" id="grid"></div>
</div>

<script>
  // Matrice esatta 12x10 dei valori HEX estratti dall'immagine
  const colorPalette = [
    // Riga 1 (Più chiari / Pastello)
    ["#FFFFFF", "#FFEAEA", "#FFF3EA", "#FFFFEA", "#F3FFEA", "#EAFFEA", "#EAFFFF", "#EAF3FF", "#EAEAFF", "#F3EAFF", "#FFEAEA", "#FFEAF3"],
    // Riga 2
    ["#E0E0E0", "#FFC5C5", "#FFE0C5", "#FFFFC5", "#E0FFC5", "#C5FFC5", "#C5FFFF", "#C5E0FF", "#C5C5FF", "#E0C5FF", "#FFC5FF", "#FFC5E0"],
    // Riga 3
    ["#C0C0C0", "#FFA0A0", "#FFCDA0", "#FFFFA0", "#CDFFA0", "#A0FFA0", "#A0FFFF", "#A0CDFF", "#A0A0FF", "#CDA0FF", "#FFA0FF", "#FFA0CD"],
    // Riga 4
    ["#A0A0A0", "#FF7B7B", "#FFBA7B", "#FFFF7B", "#BAFF7B", "#7BFF7B", "#7BFFFF", "#7BBAFF", "#7B7BFF", "#BA7BFF", "#FF7BFF", "#FF7BBA"],
    // Riga 5 (Toni vivi)
    ["#808080", "#FF5555", "#FFA655", "#FFFF55", "#A6FF55", "#55FF55", "#55FFFF", "#55A6FF", "#5555FF", "#A655FF", "#FF55FF", "#FF55A6"],
    // Riga 6 (Colori Puri / Saturation massima)
    ["#606060", "#FF0000", "#FF8000", "#FFFF00", "#80FF00", "#00FF00", "#00FFFF", "#0080FF", "#0000FF", "#8000FF", "#FF00FF", "#FF0080"],
    // Riga 7
    ["#484848", "#C40000", "#C46200", "#C4C400", "#62C400", "#00C400", "#00C4C4", "#0062C4", "#0000C4", "#6200C4", "#C400C4", "#C40062"],
    // Riga 8
    ["#303030", "#880000", "#884400", "#888800", "#448800", "#008800", "#008888", "#004488", "#000088", "#440088", "#880088", "#880044"],
    // Riga 9
    ["#181818", "#4C0000", "#4C2600", "#4C4C00", "#264C00", "#004C00", "#004C4C", "#00264C", "#00004C", "#26004C", "#4C004C", "#4C0026"],
    // Riga 10 (Scurissimi / Nero)
    ["#000000", "#200000", "#201000", "#202000", "#102000", "#002000", "#002020", "#001020", "#000020", "#100020", "#200020", "#200010"]
  ];

  const gridContainer = document.getElementById('grid');

  // Generazione automatica dei quadratini
  colorPalette.forEach(row => {
    row.forEach(hex => {
      const tile = document.createElement('div');
      tile.className = 'color-tile';
      tile.style.backgroundColor = hex;
      tile.title = hex; // Mostra il codice HEX al passaggio del mouse
      gridContainer.appendChild(tile);
    });
  });
</script>

</body>
</html>
</html>
