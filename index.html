<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Media Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #e0e0e0; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; }

    /* MOCKUP TELEFONO */
    .phone-wrapper { width: 100vw; height: 100dvh; background: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    @media (min-width: 500px) { .phone-wrapper { width: 380px; height: 780px; border-radius: 40px; border: 8px solid #000000; box-shadow: 0 20px 40px rgba(0,0,0,0.3); } }

    /* SCHERMATA DI AVVIO (SPLASH SCREEN) */
    #splash { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; }
    .logo-main { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 2px; }
    .btn-start { background: #fff; color: #000; border: none; padding: 15px 40px; border-radius: 30px; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 1rem; }

    /* SCHERMATA PRINCIPALE */
    .main-ui { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; justify-content: space-between; align-items: center; }
    .app-header { font-size: 1.2rem; font-weight: 800; text-align: center; color: #000; }

    .card-canvas-area { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }
    
    /* LA CARTA - DIMENSIONI FISSE */
    .card { 
      width: 320px; 
      height: 180px; 
      background: #ffffff; 
      border: 3px solid #000000; 
      border-radius: 18px; 
      padding: 12px; 
      display: flex; 
      gap: 12px; 
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      align-items: center;
      box-sizing: border-box;
    }

    /* RECCANGOLO IMMAGINE FLESSIBILE */
    .card-photo-box { 
      height: 100%; 
      min-width: 90px;
      max-width: 140px;
      border: 2px solid #000000; 
      border-radius: 10px; 
      background: #f0f0f0; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      overflow: hidden; 
      flex-shrink: 0;
      padding: 4px;
    }

    .card-photo-box img {
      max-height: 100%;
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .card-info-box { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; height: 100%; justify-content: center; }
    
    /* TESTI MODIFICABILI DIRETTAMENTE SULLA CARTA */
    .editable { outline: none; border: 1px dashed transparent; transition: border 0.2s; }
    .editable:hover, .editable:focus { border: 1px dashed #888; border-radius: 4px; }

    .card-title { font-size: 1.1rem; font-weight: 800; color: #000; word-break: break-word; }
    .card-voto { font-size: 0.85rem; font-weight: 800; color: #ffab00; }
    .card-review { font-size: 0.75rem; color: #333; font-style: italic; line-height: 1.2; word-break: break-word; }

    /* BOTTONE SCARICA IN BASSO */
    .btn-download { width: 100%; background: #000; color: #fff; padding: 14px; border-radius: 12px; font-weight: 800; text-align: center; cursor: pointer; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <!-- SCHERMATA START -->
    <div id="splash">
      <div class="logo-main">JOURNAL</div>
      <button class="btn-start" onclick="startApp()">INIZIA</button>
    </div>

    <!-- SCHERMATA APP -->
    <div class="main-ui" id="main-ui">
      <div class="app-header">Crea la tua Scheda</div>

      <div class="card-canvas-area">
        <div class="card" id="main-card">
          
          <!-- CONTENITORE IMMAGINE -->
          <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
            <span id="placeholder" style="font-size:0.75rem; font-weight:700; color:#666; text-align:center;">+ Inserisci Foto</span>
            <img id="card-photo-img" style="display:none;" alt="Foto">
          </div>

          <!-- INFO TESTO (Clicca per modificare) -->
          <div class="card-info-box">
            <div class="card-title editable" id="card-title" contenteditable="true" onblur="checkEmpty(this)" placeholder="Titolo">Titolo Prova</div>
            <div class="card-voto editable" id="card-voto" contenteditable="true" onblur="checkEmpty(this)">★★★★★</div>
            <div class="card-review editable" id="card-review" contenteditable="true" onblur="checkEmpty(this)">Clicca qui per scrivere la tua opinione...</div>
          </div>

        </div>
      </div>

      <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">

      <div class="btn-download" onclick="downloadCard()">Scarica Immagine</div>
    </div>
  </div>

  <script>
    function startApp() { 
      document.getElementById('splash').style.display = 'none'; 
      document.getElementById('main-ui').style.display = 'flex'; 
    }

    // Se un campo viene lasciato vuoto, non mostra nulla
    function checkEmpty(el) {
      if (el.innerText.trim() === '') {
        el.style.display = 'none';
      }
    }

    // Caricamento foto con rettangolo flessibile
    function loadPhoto(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-photo-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(file);
    }

    // Download con trasparenza dello sfondo e angoli arrotondati puliti
    function downloadCard() {
      const card = document.getElementById('main-card');
      
      html2canvas(card, { 
        scale: 3,
        backgroundColor: null, 
        useCORS: true,
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'scheda.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
