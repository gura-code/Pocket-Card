<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Collection Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100dvh; background: #e0e0e0; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; }

    /* STRUTTURA */
    .container { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    /* CARTA A DIMENSIONI STANDARD FISSE */
    .card { 
      width: 320px; 
      height: 180px; 
      background: #fff; 
      border: 3px solid #000; 
      border-radius: 18px; 
      padding: 10px; 
      display: flex; 
      gap: 10px; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
      overflow: hidden;
    }

    /* IL RIQUADRO FOTO SI ADATTA ALLA PROPORZIONE DELL'IMMAGINE */
    .card-photo-container { 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      border: 2px solid #000; 
      border-radius: 10px; 
      background: #f0f0f0; 
      cursor: pointer;
      flex-shrink: 0; 
      /* La larghezza si adatta all'immagine */
      width: auto; 
      max-width: 150px; 
      overflow: hidden;
    }

    .card-photo-container img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain; /* NESSUN TAGLIO, NESSUNA DISTORSIONE */
    }

    .card-info { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .card-title { font-size: 1.1rem; font-weight: 800; color: #000; }
    .card-voto { font-size: 0.8rem; font-weight: 800; color: #666; }
    .card-review { font-size: 0.7rem; color: #444; font-style: italic; line-height: 1.2; }

    /* CONTROLLI */
    .controls { margin-top: 30px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    .input-box { width: 100%; padding: 12px; border: 2px solid #000; border-radius: 12px; }
    .btn-save { background: #000; color: #fff; padding: 12px; text-align: center; border-radius: 12px; cursor: pointer; font-weight: 800; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- CARTA -->
    <div class="card" id="main-card">
      <div class="card-photo-container" id="photo-box" onclick="document.getElementById('file-input').click()">
        <span id="placeholder" style="font-size:0.7rem; padding:10px;">+</span>
        <img id="card-photo-img" style="display:none;" alt="Foto">
      </div>
      <div class="card-info">
        <div class="card-title" id="card-title">Titolo</div>
        <div class="card-voto" id="card-voto">Voto: -</div>
        <div class="card-review" id="card-review">Opinione...</div>
      </div>
    </div>
    
    <!-- CONTROLLI -->
    <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">
    <div class="controls">
      <input type="text" class="input-box" placeholder="Titolo" oninput="update('card-title', this.value)">
      <input type="text" class="input-box" placeholder="Voto" oninput="update('card-voto', 'Voto: ' + this.value)">
      <textarea class="input-box" placeholder="Recensione..." oninput="update('card-review', this.value)" style="height:60px; resize:none;"></textarea>
      <div class="btn-save" onclick="downloadCard()">Scarica Immagine</div>
    </div>
  </div>

  <script>
    function update(id, val) { document.getElementById(id).innerText = val || (id==='card-title'?'Titolo':id==='card-voto'?'Voto: -':'Opinione...'); }
    
    function loadPhoto(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-photo-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(e.target.files[0]);
    }

    function downloadCard() {
      // Catturiamo solo il box card con dimensioni bloccate
      html2canvas(document.getElementById('main-card'), { 
        scale: 3, 
        width: 320, 
        height: 180 
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
