<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Media Collection Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #fce4ec; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; }

    .phone-wrapper {
      width: 100vw; height: 100dvh; background: #fff0f3; position: relative; overflow: hidden; display: flex; flex-direction: column;
    }
    @media (min-width: 500px) {
      .phone-wrapper { width: 380px; height: 780px; border-radius: 40px; border: 8px solid #ffccd5; box-shadow: 0 20px 40px rgba(255, 133, 162, 0.3); }
    }

    .screen { width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; padding: 20px 15px; }
    .screen.active { display: flex; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .btn-main { background: #ff85a2; color: white; border: none; padding: 12px 35px; font-weight: 800; border-radius: 30px; cursor: pointer; margin-top: 15px; width: 100%; max-width: 280px; text-align: center; }

    /* CARTA MEDIA */
    .card-canvas-area { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; }
    .anime-card-horizontal {
      width: 310px; height: 185px; background: #ffffff; border: 3px solid #ffccd5; border-radius: 18px; padding: 12px; display: flex; gap: 12px; box-shadow: 0 8px 20px rgba(255, 133, 162, 0.15);
    }
    .card-photo-box { width: 110px; height: 100%; border: 2px dashed #ff85a2; border-radius: 12px; background: #fff0f3; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; flex-shrink: 0; }
    .card-photo-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .card-info-box { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .card-title { font-size: 1.1rem; font-weight: 800; color: #444; }
    .card-voto { font-size: 0.85rem; font-weight: 800; color: #ff85a2; }
    .card-review { font-size: 0.7rem; color: #666; font-style: italic; line-height: 1.2; height: 60px; overflow: hidden; }

    /* INPUTS */
    .input-box { width: 100%; padding: 10px; border: 2px solid #ffccd5; border-radius: 12px; margin-bottom: 8px; outline: none; }
    .controls-wrapper { width: 100%; background: white; border-radius: 20px; padding: 15px; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
    .opt-card { background: #fff0f3; border: 2px solid #ffccd5; border-radius: 12px; padding: 8px; text-align: center; font-size: 0.75rem; font-weight: 700; color: #ff6584; cursor: pointer; }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <!-- GIOCO -->
    <div id="screen-game" class="screen active">
      <div style="font-weight: 800; color: #ff85a2; margin-bottom: 10px;">Crea la tua Collezione</div>

      <div class="card-canvas-area">
        <div class="anime-card-horizontal" id="main-card">
          <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
            <span id="placeholder" style="font-size:0.7rem; color:#ff85a2;">Poster 📷</span>
            <img id="card-photo-img" alt="Foto">
          </div>
          <div class="card-info-box">
            <div class="card-title" id="card-title">Titolo Opera</div>
            <div class="card-voto" id="card-voto">Voto: ★★★★☆</div>
            <div class="card-review" id="card-review">La tua opinione qui...</div>
          </div>
        </div>
      </div>
      <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">

      <div class="controls-wrapper">
        <input type="text" class="input-box" placeholder="Titolo Anime/Film" oninput="update('card-title', this.value)">
        <input type="text" class="input-box" placeholder="Voto (es. 5/5)" oninput="update('card-voto', 'Voto: ' + this.value)">
        <textarea class="input-box" placeholder="Cosa ne pensi?" oninput="update('card-review', this.value)" style="height: 60px; resize:none;"></textarea>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="opt-card" onclick="setTheme('#ffffff', '#444')">Light Mode</div>
          <div class="opt-card" onclick="setTheme('#222', '#fff')">Dark Mode</div>
        </div>
        <button class="btn-main" onclick="downloadCard()">Scarica Immagine</button>
      </div>
    </div>
  </div>

  <script>
    function update(id, val) { document.getElementById(id).innerText = val; }
    
    function loadPhoto(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-photo-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(e.target.files[0]);
    }

    function setTheme(bg, text) {
      const card = document.getElementById('main-card');
      card.style.background = bg;
      document.getElementById('card-title').style.color = text;
      document.getElementById('card-voto').style.color = (text === '#fff') ? '#ff85a2' : '#ff85a2';
      document.getElementById('card-review').style.color = (text === '#fff') ? '#ddd' : '#666';
    }

    function downloadCard() {
      html2canvas(document.getElementById('main-card'), { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'mia-collezione.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
